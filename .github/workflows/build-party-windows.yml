name: Build OpenHome Party Windows

on:
  push:
    branches:
      - party-support
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Patch LGPE party display
        run: node scripts/patch-lgpe-party.cjs

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Align Tauri JS versions with Rust crates
        run: pnpm add --save-exact @tauri-apps/api@2.12.3 @tauri-apps/plugin-window-state@2.5.0 @tauri-apps/plugin-os@2.4.0 @tauri-apps/plugin-dialog@2.8.2 @tauri-apps/plugin-fs@2.7.0 @tauri-apps/cli@2.12.3

      - name: Build Windows app
        run: pnpm tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenHome-Party-Windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
